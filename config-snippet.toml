# Merge these settings into ~/.codex/config.toml.
# Do not overwrite unrelated existing configuration.

model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

# Leave the global service_tier unset for normal/Standard Sol service.
# Each Luna role selects service_tier = "fast" independently.

[features]
fast_mode = true
multi_agent = true

[agents]
max_concurrent_threads_per_session = 3

# Compatibility note:
# Do not initially set agents.default_subagent_model. Each custom role pins
# gpt-5.6-luna directly, avoiding the launcher conflict observed in some builds.
