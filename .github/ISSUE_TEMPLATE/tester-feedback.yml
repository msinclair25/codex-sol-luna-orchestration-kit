name: V0.6.1 tester feedback
description: Share a real-project Sol/Luna test result, including what worked.
title: "[Tester]: "
labels:
  - tester-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing V0.6.1. Please describe behavior, not private project content. Never include credentials, customer data, private prompts, production logs, or sensitive source code.

  - type: input
    id: kit-version
    attributes:
      label: Kit version
      description: The version reported by Sol/Luna status.
      placeholder: 0.6.1
    validations:
      required: true

  - type: dropdown
    id: install-mode
    attributes:
      label: Install mode
      options:
        - Full roles
        - Workflow-only
        - Repository evaluation only
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Luna tier
      options:
        - Fast
        - Standard
        - Not applicable
    validations:
      required: true

  - type: input
    id: codex-environment
    attributes:
      label: Codex environment
      description: Include the Codex version or build, surface, and operating system.
      placeholder: Codex Desktop 1.x on macOS 15.x
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11 native
        - Windows 10 native
        - Windows through WSL2
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: test-scenario
    attributes:
      label: Test scenario
      description: What kind of task did you try? Keep project details generic.
      placeholder: A bounded implementation with independent review and validation lanes.
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: Tell us what worked, what was confusing, and whether routing and evidence felt useful.
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Sanitized status output
      description: Optional. Remove paths, identifiers, prompts, source, logs, and secrets first.
      render: shell

  - type: dropdown
    id: recommendation
    attributes:
      label: Would you keep using the kit?
      options:
        - Yes
        - Maybe, after changes
        - No
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, customer data, private prompts, production logs, sensitive source, paths, and identifiers.
          required: true
