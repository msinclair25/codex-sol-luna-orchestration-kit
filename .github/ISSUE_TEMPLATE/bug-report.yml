name: Bug report
description: Report a reproducible setup, routing, status, update, or metrics problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never include credentials, customer data, private prompts, production logs, or sensitive source code. Security concerns belong in the private process described by SECURITY.md.

  - type: input
    id: kit-version
    attributes:
      label: Kit version
      placeholder: 0.6.0
    validations:
      required: true

  - type: input
    id: codex-environment
    attributes:
      label: Codex environment
      description: Include the Codex version or build, surface, and operating system.
    validations:
      required: true

  - type: dropdown
    id: install-mode
    attributes:
      label: Install mode
      options:
        - Full roles · Fast
        - Full roles · Standard
        - Workflow-only
        - Repository evaluation only
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failed or behaved unexpectedly?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use generic or synthetic project details.
      placeholder: |
        1. Install workflow-only mode.
        2. Restart Codex.
        3. Run the status skill.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Include bounded Doctor or status output only after removing sensitive data.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, customer data, private prompts, production logs, sensitive source, paths, and identifiers.
          required: true
